[project]
name = "sftools"
version = "0.1.0"
description = "Production planner for Satisfactory"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "markdown>=3.7",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "websockets>=17.2",
]
scrape = [
    "requests>=2.32",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Unit tests by default; integration tests: uv run pytest tests/integration (see tests/README.md)
testpaths = ["tests/unit"]
addopts = "--import-mode=importlib"

[tool.ruff.lint]
# Rules that find bugs (pyflakes, bugbear), not style. B008 flags FastAPI's Depends(...) defaults.
select = ["F", "B"]
ignore = ["B008"]
