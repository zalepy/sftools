# On every push: lint (bug-finding rules only: ruff, see pyproject.toml; ESLint, see eslint.config.mjs),
# file sizes, and the unit and browser tests. It reports on the commit; nothing is blocked. The run against
# the deployed site is a release step (scripts/release_check.py).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: uv sync
      - name: Lint
        run: uvx ruff check src tests scripts
      - name: JS lint
        if: ${{ !cancelled() }}  # after a lint failure too: all the results in one run
        run: npx --yes eslint@10.12.0 src/sftools/web/static/js tests/js
      - name: File sizes
        if: ${{ !cancelled() }}
        run: uv run python scripts/check_sizes.py
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: uv run pytest -q
      - name: JS unit tests
        if: ${{ !cancelled() }}
        run: node --test "tests/js/*.test.mjs"
      - name: Browser tests (headless Chrome)
        if: ${{ !cancelled() }}
        run: uv run pytest -q tests/integration
